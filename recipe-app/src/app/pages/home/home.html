<!-- Search Component -->
<app-search 
  (resultsFound)="onResults($event)" 
  (loading)="onLoading($event)">
</app-search>

<!-- Loading State -->
<div *ngIf="loading" class="loader-container">
  <p>Searching for delicious recipes...</p>
</div>

<!-- No Results -->
<div *ngIf="!loading && searchPerformed && uniqueRecipes().length === 0" class="no-results-container">
  <div class="no-results-content">
    <span class="search-icon">🔍</span>
    <h3>No Recipes Found</h3>
    <p>We couldn't find any recipes matching your search.</p>
  </div>
</div>

<!-- Recipes Grid -->
<app-recipe-grid 
  *ngIf="!loading && uniqueRecipes().length > 0" 
  [recipes]="uniqueRecipes()" 
  [loading]="loading">
</app-recipe-grid>
